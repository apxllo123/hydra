name: Mac Compatibility Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  mac-compatibility:
    name: Test Mac Compatibility
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: TypeScript type check
        run: yarn typecheck:node

      - name: Run Mac compatibility unit tests
        run: |
          node --import ./scripts/register-ts-node.mjs --test \
            src/main/services/mac-compatibility/MacCompatibilityManager.test.ts \
            src/main/services/mac-compatibility/MacCompatibilityRegistry.test.ts

      - name: Run Mac compatibility renderer tests
        run: yarn test:renderer:mac

      - name: Verify macOS environment
        run: |
          set -e

          echo "=== macOS environment ==="
          sw_vers
          test "$(uname -s)" = "Darwin"

          echo ""
          echo "=== Architecture ==="
          uname -m

          echo ""
          echo "=== Node.js ==="
          node --version

          echo ""
          echo "=== Yarn ==="
          yarn --version

          echo ""
          echo "=== Mac compatibility source ==="
          test -d src/main/services/mac-compatibility
          find src/main/services/mac-compatibility -maxdepth 2 -type f | sort

          echo ""
          echo "=== Required compatibility files ==="
          test -f src/main/services/mac-compatibility/MacCompatibilityManager.ts
          test -f src/main/services/mac-compatibility/MacCompatibilityManager.test.ts
          test -f src/main/services/mac-compatibility/MacCompatibilityRegistry.ts
          test -f src/main/services/mac-compatibility/MacCompatibilityTypes.ts
          test -f src/main/services/mac-compatibility/MacSystemDetector.ts
          test -f src/main/services/mac-compatibility/MacWineDetector.ts

          echo ""
          echo "=== Mac compatibility test complete ==="
